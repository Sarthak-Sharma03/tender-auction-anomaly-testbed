[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tender-auction-anomaly-testbed"
version = "0.7.0"
description = "Tender/auction anomaly detection testbed (budgeted review, drift) with a small production-style reference pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sarthak Sharma" }]

dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "openpyxl>=3.1",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "reportlab>=4.0",
]
api = [
  "fastapi>=0.110",
  "uvicorn>=0.23",
  "pydantic>=2.0",
]

[project.scripts]
tad = "tad.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
exclude = ["legacy"]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
